version: 2.1
jobs:
  build:
    working_directory: ~/project
    docker:
      - image: cimg/go:1.27.4
        environment:
          TEST_RESULTS: /tmp/test-results
      - image: confluentinc/cp-zookeeper:5.2.1
        environment:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
      - image: confluentinc/cp-kafka:5.2.1
        environment:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: localhost:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      - image: confluentinc/cp-ksql-server:5.2.1
        environment:
          KSQL_BOOTSTRAP_SERVERS: localhost:9092
          KSQL_LISTENERS: http://0.0.0.0:8088/
    steps:
      - checkout
      - run: go version
      - run: make build
      - run: make vet
      - run: make test
      - store_artifacts:
          path: terraform-provider-ksql
          destination: terraform-provider-ksql
      - run: mkdir -p $TEST_RESULTS
      - run:
          name: Wait for ksql
          command: |
            curl --fail --silent --show-error --retry 30 --retry-connrefused \
              --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:8088 >/dev/null
      - run:
          name: Run Tests
          command: |
            TF_LOG=debug KSQL_SERVER_URL=localhost:8088 TF_ACC=1 \
              gotestsum --junitfile "$TEST_RESULTS/go-test-report.xml" -- -v -timeout 120m ./...
      - store_test_results:
          path: /tmp/test-results

workflows:
  build:
    jobs:
      - build
